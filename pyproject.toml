[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 licence metadata (CAP-044)
build-backend = "hatchling.build"

[project]
name = "capellactl"
version = "1.0.0.dev0"
description = "Declarative, idempotent CLI for Couchbase Capella (Management API v4.0)"
readme = "README.md"
authors = [{ name = "Anuj Sahni", email = "anuj.sahni@couchbase.com" }]
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "click>=8.1",
  "requests>=2.31",
  "PyYAML>=6.0",
  "jsonschema>=4.20",
  "rich>=13.0",
  "keyring>=24.0",
  "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "responses>=0.25",
  "freezegun>=1.4",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-requests",
  "types-PyYAML",
  "hatchling>=1.27",   # build the wheel offline in tests (CAP-044 AC5)
  "packaging>=23.0",   # scripts/third-party-notices.py
]

[project.urls]
Homepage = "https://github.com/couchbaselabs/capellactl"

[project.scripts]
capellactl = "capellactl.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["capellactl"]

[tool.hatch.build.targets.wheel.force-include]
"capellactl/config/schema.json" = "capellactl/config/schema.json"
"capellactl/config/presets.yaml" = "capellactl/config/presets.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "story(id, ac): links a test to a story acceptance criterion",
  "integration: runs against a real Capella sandbox organization",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["capellactl.api.*", "capellactl.engine.*", "capellactl.resources.*"]
strict = true
