name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # re-run by hand: Actions → ci → Run workflow

concurrency:                # a newer push to the same branch cancels the older run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # GitHub sets CI=true; tests/conftest.py clears it so CI-only output is tested on purpose (CAP-042 AC3).
      # Text I/O without an explicit encoding fails here on every OS, not only on Windows (pyproject.toml).
      PYTHONWARNDEFAULTENCODING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check capellactl tests scripts
      - run: python -m mypy capellactl
      - run: python -m pytest
      - run: python scripts/check-ac-coverage.py
      - run: python scripts/update-story-index.py --check docs/release-1.0.0
      - run: python scripts/update-api-coverage.py --check     # API-COVERAGE.md matches story statuses
      - run: python scripts/third-party-notices.py --check      # CAP-044 AC3/AC4, per OS and Python
      - run: python scripts/update-reference.py --check         # docs/reference.md matches the schema (CAP-033)

  install-smoke:            # CAP-001 AC1
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # the version comes from git tags (scripts/version.py)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" pipx
      - run: python scripts/build-dist.py    # make dist (CAP-043 AC8)
      - shell: bash
        run: pipx install dist/*.whl && capellactl --version

  image-smoke:              # CAP-001 AC6
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" && python scripts/build-dist.py
      - run: docker build -t capellactl:ci .
      - run: docker run --rm capellactl:ci --version
      - run: test "$(docker run --rm --entrypoint id capellactl:ci -u)" != "0"
      - run: |
          docker pull -q python:3.12-slim
          base=$(docker image inspect python:3.12-slim --format '{{.Size}}')
          size=$(docker image inspect capellactl:ci --format '{{.Size}}')
          echo "image adds $(( (size - base) / 1048576 )) MB to python:3.12-slim"
          test $(( size - base )) -lt 52428800
